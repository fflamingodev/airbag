# Keycloak, partagé par les 5 démos : la connexion (qui êtes-vous ?).
# Le realm de démo (comptes, rôles, application) est importé au premier démarrage.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Adresse fixe de Keycloak (celle du navigateur), même quand une app l'appelle de l'intérieur
      # de Docker (http://keycloak:8080). Nécessaire pour la démo KAS, qui renvoie le jeton à Keycloak.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"   # console d'administration : http://localhost:8080 (admin / admin)
